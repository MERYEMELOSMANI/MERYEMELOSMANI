<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 6" width="100%" height="6">
  <defs>
    <linearGradient id="rainbowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff0055">
        <animate attributeName="stop-color" values="#ff0055;#ff9900;#ffee00;#00ff66;#00ccff;#9900ff;#ff0055" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="25%" stop-color="#ff9900">
        <animate attributeName="stop-color" values="#ff9900;#ffee00;#00ff66;#00ccff;#9900ff;#ff0055;#ff9900" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#00ff66">
        <animate attributeName="stop-color" values="#00ff66;#00ccff;#9900ff;#ff0055;#ff9900;#ffee00;#00ff66" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="75%" stop-color="#00ccff">
        <animate attributeName="stop-color" values="#00ccff;#9900ff;#ff0055;#ff9900;#ffee00;#00ff66;#00ccff" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#ff0055">
        <animate attributeName="stop-color" values="#ff0055;#ff9900;#ffee00;#00ff66;#00ccff;#9900ff;#ff0055" dur="4s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="900" height="4" y="1" rx="2" fill="url(#rainbowGrad)" filter="url(#glow)"/>
</svg>
