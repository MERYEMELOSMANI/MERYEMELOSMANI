<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="100%" height="380">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="termBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c1017"/>
      <stop offset="100%" stop-color="#05080d"/>
    </linearGradient>

    <!-- Outer Window Drop Shadow -->
    <filter id="termShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    .mono {
      font-family: 'Space Grotesk', 'Fira Code', 'Courier New', monospace;
    }
    .cursor {
      fill: #ffd166;
      animation: blink 0.85s infinite;
    }
    .dot-red { fill: #ff5f56; }
    .dot-yellow { fill: #ffbd2e; }
    .dot-green { fill: #27c93f; }
    .term-title { font-size: 13px; font-weight: 600; fill: #8b949e; }
    .term-status { font-size: 11px; font-weight: 700; fill: #39d353; letter-spacing: 1px; }
    .welcome { font-size: 13px; font-weight: 700; fill: #4cc9f0; }
    .prompt { font-size: 13px; font-weight: 700; fill: #4cc9f0; }
    .cmd { font-size: 13px; font-weight: 700; fill: #ffffff; }
    .key { font-size: 12px; font-weight: 700; fill: #9d4edd; }
    .val { font-size: 12px; fill: #c9d1d9; }
    .hl-gold { font-size: 12px; font-weight: 700; fill: #ffd166; }
    .hl-green { font-size: 12px; font-weight: 700; fill: #39d353; }
    .link-cyan { font-size: 12px; font-weight: 600; fill: #58a6ff; text-decoration: underline; }
  </style>

  <!-- Window Container with Shadow -->
  <g filter="url(#termShadow)">
    <rect x="25" y="15" width="850" height="350" rx="12" fill="url(#termBg)" stroke="#30363d" stroke-width="1.5"/>
  </g>

  <!-- Title Bar -->
  <rect x="25" y="15" width="850" height="38" rx="12" fill="#161b22"/>
  <rect x="25" y="41" width="850" height="12" fill="#161b22"/>
  <line x1="25" y1="53" x2="875" y2="53" stroke="#30363d" stroke-width="1"/>

  <!-- macOS Window Dots -->
  <circle cx="48" cy="34" r="6" class="dot-red"/>
  <circle cx="68" cy="34" r="6" class="dot-yellow"/>
  <circle cx="88" cy="34" r="6" class="dot-green"/>

  <!-- Window Title -->
  <text x="450" y="38" text-anchor="middle" class="mono term-title">meryem@ai-quantum-core:~ (zsh interactive)</text>

  <!-- Online Status -->
  <circle cx="770" cy="34" r="4" fill="#39d353"/>
  <text x="782" y="38" class="mono term-status">ONLINE</text>

  <!-- Terminal Body Content -->
  <g class="mono" transform="translate(48, 76)">
    <!-- Header Welcome Banner -->
    <text x="0" y="0" class="welcome">⚡ CONNECTED TO MERYEM EL OSMANI PORTFOLIO CLI [v2.4.0]</text>
    <text x="0" y="18" font-size="11" fill="#8b949e">Shell: <tspan fill="#4cc9f0">zsh 5.9</tspan> • Type <tspan fill="#ffd166">help</tspan> for commands • Architecture: <tspan fill="#9d4edd">x86_64-quantum-arch</tspan></text>

    <!-- Command 1: whoami -->
    <text x="0" y="46" class="prompt">visitor@meryem-os:~$ <tspan class="cmd">whoami</tspan></text>
    <text x="14" y="66" class="key">► NAME: <tspan class="cmd">Meryem El Osmani</tspan> <tspan class="val">• AI &amp; Optimal Decision Systems Engineer</tspan></text>
    <text x="14" y="84" class="key">► DEGREE: <tspan class="val">Master's in AI &amp; Optimal Decision Systems — </tspan><tspan class="hl-gold">Faculté des Sciences de Meknès 🇲🇦</tspan></text>

    <!-- Command 2: skills -->
    <text x="0" y="114" class="prompt">visitor@meryem-os:~$ <tspan class="cmd">skills --summary</tspan></text>
    <text x="14" y="134" class="key">► AI &amp; ML: <tspan class="val">PyTorch, Scikit-Learn, LangGraph Multi-Agent, Vector Search, PuLP Simplex</tspan></text>
    <text x="14" y="152" class="key">► STACK: <tspan class="val">FastAPI, DuckDB, Polars, React 19, Next.js 16, TypeScript, Three.js WebGL</tspan></text>

    <!-- Command 3: certs -->
    <text x="0" y="182" class="prompt">visitor@meryem-os:~$ <tspan class="cmd">credentials --verified</tspan></text>
    <text x="14" y="202" class="key">► CREDLY: <tspan class="hl-green">✓ 5 Verified Badges</tspan> <tspan class="val">(IBM Data Analysis, Gen AI, Google Cloud Cybersecurity)</tspan></text>

    <!-- Command 4: hire -->
    <text x="0" y="232" class="prompt">visitor@meryem-os:~$ <tspan class="cmd">sudo hire --candidate=meryem</tspan></text>
    <text x="14" y="252" class="hl-green">[ACCESS GRANTED: CANDIDATE VERIFIED &amp; READY TO DEPLOY]</text>
    <text x="14" y="270" class="key">► DIRECT CONTACT: <tspan class="hl-gold">m.elosmani@edu.umi.ac.ma</tspan> • <tspan class="link-cyan">linkedin.com/in/meryemelosmani</tspan></text>

    <!-- Active Prompt with Blinking Cursor -->
    <line x1="0" y1="284" x2="804" y2="284" stroke="#21262d" stroke-width="1"/>
    <text x="0" y="304" class="prompt">visitor@meryem-os:~$ <tspan class="cursor">█</tspan></text>
  </g>
</svg>
